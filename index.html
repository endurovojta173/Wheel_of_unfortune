<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kolo Neštěstí</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <meta name="description" content="Vyzkoušej své štěstí (nebo spíše neštěstí) na tomto zábavném kole osudu!">
</head>
<body>
    <div class="layout-wrapper">
        <!-- Univerzální tlačítko pro menu (Hamburger) -->
        <button id="menuToggleBtn" class="menu-toggle-btn" aria-label="Přepnout menu">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        
        <div id="menuOverlay" class="menu-overlay hidden"></div>

        <aside id="sidebar" class="sidebar">
            <div class="menu-header">
                <h2>Kategorie</h2>
            </div>
            <ul id="setList" class="set-list">
                <!-- Dynamicky plněno z JS -->
            </ul>
        </aside>
        
        <div class="app-container">
        <header>
            <h1 class="glitch" data-text="KOLO NEŠTĚSTÍ">KOLO NEŠTĚSTÍ</h1>
            <p>Zatoč si pro svou denní dávku utrpení.</p>
        </header>
        
        <main class="wheel-container">
            <div class="pointer"></div>
            <div class="canvas-wrapper">
                <canvas id="wheelCanvas"></canvas>
            </div>
            
            <button id="spinBtn" class="spin-btn">
                <span class="btn-text">ZATOČIT</span>
                <span class="btn-bg"></span>
            </button>
        </main>

        <div id="resultModal" class="modal hidden">
            <div class="modal-content glass">
                <h2>Tvůj osud:</h2>
                <p id="resultText">Něco se pokazilo</p>
                <button id="closeModalBtn" class="close-btn">Přijmout osud</button>
            </div>
        </div>
    </div>
    </div>
    
    <!-- Animace konfet -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
